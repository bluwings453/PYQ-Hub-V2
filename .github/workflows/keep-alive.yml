name: Keep Render backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -sf https://pyq-hub-v2.onrender.com/api/health \
            && echo "Backend responded - awake." \
            || echo "No response yet (likely mid wake-up) - not a failure."
